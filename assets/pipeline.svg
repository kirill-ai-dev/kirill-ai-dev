<svg xmlns="http://www.w3.org/2000/svg" width="880" height="244" viewBox="0 0 880 244" role="img" aria-label="Процесс → Разбор → Архитектура → LLM + продукт → Прод">
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flow{stroke-dasharray:640;stroke-dashoffset:640;animation:flow 8s ease-in-out infinite}@keyframes flow{0%{stroke-dashoffset:640}70%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.n0{animation:n0 8s ease-in-out infinite}@keyframes n0{0%,0.00%{stroke:#16264a}3.00%,92%{stroke:#3FB4F3}100%{stroke:#16264a}}
.n1{animation:n1 8s ease-in-out infinite}@keyframes n1{0%,17.49%{stroke:#16264a}20.50%,92%{stroke:#3FB4F3}100%{stroke:#16264a}}
.n2{animation:n2 8s ease-in-out infinite}@keyframes n2{0%,34.99%{stroke:#16264a}38.00%,92%{stroke:#3FB4F3}100%{stroke:#16264a}}
.n3{animation:n3 8s ease-in-out infinite}@keyframes n3{0%,52.49%{stroke:#16264a}55.50%,92%{stroke:#3FB4F3}100%{stroke:#16264a}}
.n4{animation:n4 8s ease-in-out infinite}@keyframes n4{0%,69.99%{stroke:#16264a}73.00%,92%{stroke:#3FB4F3}100%{stroke:#16264a}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#0b1830"/></linearGradient>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#263FB0"/><stop offset="1" stop-color="#3FB4F3"/></linearGradient>
<radialGradient id="glowA" cx=".85" cy=".1" r=".6"><stop offset="0" stop-color="#263FB0" stop-opacity=".45"/><stop offset="1" stop-color="#263FB0" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx=".1" cy="1" r=".5"><stop offset="0" stop-color="#3FB4F3" stop-opacity=".16"/><stop offset="1" stop-color="#3FB4F3" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
</defs>
<rect width="880" height="244" rx="18" fill="url(#bg)"/><rect width="880" height="244" rx="18" fill="url(#grid)"/><rect width="880" height="244" rx="18" fill="url(#glowA)"/><rect width="880" height="244" rx="18" fill="url(#glowB)"/><rect x=".5" y=".5" width="879" height="243" rx="18" fill="none" stroke="#16264a"/>
<text x="36" y="44" class="m" font-size="12" letter-spacing="1.5" fill="#8A9BC4"><tspan fill="#3FB4F3">01 //</tspan> КАК ЗАДАЧА ПРЕВРАЩАЕТСЯ В СИСТЕМУ</text>
<path d="M108.0 142.0 H772.0" stroke="#16264a" stroke-width="2" stroke-dasharray="4 6"/>
<path class="flow" d="M108.0 142.0 H772.0" stroke="url(#brand)" stroke-width="2" fill="none"/>
<rect class="n0" x="36.0" y="96" width="144" height="92" rx="14" fill="#0a1628" stroke="#16264a" stroke-width="1.5"/>
<text x="52.0" y="122" class="m" font-size="11" fill="#52628A">01</text>
<text x="52.0" y="150" class="s" font-size="16" font-weight="700" fill="#E6ECFA">Процесс</text>
<text x="52.0" y="170" class="s" font-size="12" fill="#8A9BC4">ручной, с потерями</text>
<rect class="n1" x="202.0" y="96" width="144" height="92" rx="14" fill="#0a1628" stroke="#16264a" stroke-width="1.5"/>
<text x="218.0" y="122" class="m" font-size="11" fill="#52628A">02</text>
<text x="218.0" y="150" class="s" font-size="16" font-weight="700" fill="#E6ECFA">Разбор</text>
<text x="218.0" y="170" class="s" font-size="12" fill="#8A9BC4">данные, узкие места</text>
<rect class="n2" x="368.0" y="96" width="144" height="92" rx="14" fill="#0a1628" stroke="#16264a" stroke-width="1.5"/>
<text x="384.0" y="122" class="m" font-size="11" fill="#52628A">03</text>
<text x="384.0" y="150" class="s" font-size="16" font-weight="700" fill="#E6ECFA">Архитектура</text>
<text x="384.0" y="170" class="s" font-size="12" fill="#8A9BC4">scope и критерии</text>
<rect class="n3" x="534.0" y="96" width="144" height="92" rx="14" fill="#0a1628" stroke="#16264a" stroke-width="1.5"/>
<text x="550.0" y="122" class="m" font-size="11" fill="#52628A">04</text>
<text x="550.0" y="150" class="s" font-size="16" font-weight="700" fill="#E6ECFA">LLM + продукт</text>
<text x="550.0" y="170" class="s" font-size="12" fill="#8A9BC4">сервис + интерфейс</text>
<rect class="n4" x="700.0" y="96" width="144" height="92" rx="14" fill="#0e2150" stroke="#16264a" stroke-width="1.5"/>
<text x="716.0" y="122" class="m" font-size="11" fill="#52628A">05</text>
<text x="716.0" y="150" class="s" font-size="16" font-weight="700" fill="#E6ECFA">Прод</text>
<text x="716.0" y="170" class="s" font-size="12" fill="#8A9BC4">метрики и поддержка</text>
<circle cx="826.0" cy="118" r="4" fill="#3FB4F3"/><circle class="pulse" cx="826.0" cy="118" r="4" fill="none" stroke="#3FB4F3"/>
<circle r="5" fill="#3FB4F3"><animateMotion dur="5.6s" begin="0s" repeatCount="indefinite" path="M108.0 142.0 H772.0" keyPoints="0;1;1" keyTimes="0;.99;1" calcMode="linear"/></circle>
<text x="36" y="222" class="s" font-size="13" fill="#8A9BC4">Лично отвечаю за требования, архитектуру, приёмку, код, деплой и результат в эксплуатации.</text>
</svg>