<rect width="880" height="170" rx="18" fill="url(#bg)"/><rect width="880" height="170" rx="18" fill="url(#grid)"/><rect width="880" height="170" rx="18" fill="url(#glowA)"/><rect width="880" height="170" rx="18" fill="url(#glowB)"/><rect x=".5" y=".5" width="879" height="169" rx="18" fill="none" stroke="#16264a"/>
<text x="36" y="44" class="m" font-size="12" letter-spacing="1.5" fill="#8A9BC4"><tspan fill="#3FB4F3">05 //</tspan> СЛЕДУЮЩИЙ ШАГ</text>
<text x="36" y="92" class="s" font-size="30" font-weight="800" fill="#E6ECFA" letter-spacing="-.5">Обсудим задачу — 30 минут,</text>
<text x="36" y="126" class="s" font-size="30" font-weight="800" fill="#E6ECFA" letter-spacing="-.5">без обязательств<tspan fill="#3FB4F3">.</tspan></text>
<text x="844" y="92" text-anchor="end" class="s" font-size="13.5" fill="#8A9BC4">Расскажите про процесс, который</text>
<text x="844" y="112" text-anchor="end" class="s" font-size="13.5" fill="#8A9BC4">хочется автоматизировать — скажу,</text>
<text x="844" y="132" text-anchor="end" class="s" font-size="13.5" fill="#8A9BC4">реально ли это и с чего начать.</text>
