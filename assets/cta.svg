<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#263FB0"/><stop offset="1" stop-color="#3FB4F3"/></linearGradient>
<radialGradient id="glowA" cx=".85" cy=".1" r=".6"><stop offset="0" stop-color="#263FB0" stop-opacity=".45"/><stop offset="1" stop-color="#263FB0" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx=".1" cy="1" r=".5"><stop offset="0" stop-color="#3FB4F3" stop-opacity=".16"/><stop offset="1" stop-color="#3FB4F3" stop-opacity="0"/></radialGradient>
